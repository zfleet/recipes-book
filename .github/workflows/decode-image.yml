name: Decode recipe images

# Les images de recettes sont poussées en base64 (images/*.jpg.b64) parce que
# le connecteur GitHub ne gère que le texte. Ce workflow les décode en JPG,
# supprime le .b64 et commit le résultat sur la même branche.

on:
  push:
    paths:
      - 'images/*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decode .b64 images
        run: |
          set -e
          shopt -s nullglob
          for f in images/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm "$f"
            echo "Decoded: $f -> $out"
          done

      - name: Commit decoded images
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Images : décodage .b64 en JPG"
          git push